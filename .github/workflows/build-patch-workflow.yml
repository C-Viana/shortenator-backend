name: Build Patches

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Shortenator-Server / production
      deployment: false
    permissions:
      contents: write
      packages: write
    env:
      JWT_SECRET: ${{secrets.JWT_SECRET}}
      EMAIL_USERNAME: ${{secrets.EMAIL_USERNAME}}
      EMAIL_PASSWORD: ${{secrets.EMAIL_PASSWORD}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Verify and test with Maven
      run: mvn -B verify --file pom.xml

    - name: Version Bump
      id: version_update
      run: bash UpdateProjectVersion.sh "PATCH"

    - name: Commit version bump
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: bump version [${{ steps.version_update.outputs.UPDATED_VERSION }}]"
        file_pattern: pom.xml
        branch: master
