# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Build Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Tipo de versão'
        required: true
        default: 'MINOR'
        type: choice
        options:
          - MAJOR
          - MINOR
          - PATCH

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Shortenator-Server / production
      deployment: true
    permissions:
      contents: write
      packages: write
    env:
      JWT_SECRET: ${{secrets.JWT_SECRET}}
      EMAIL_USERNAME: ${{secrets.EMAIL_USERNAME}}
      EMAIL_PASSWORD: ${{secrets.EMAIL_PASSWORD}}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file
    
    - name: Verify and test with Maven
      run: mvn -B verify --file pom.xml

    - name: Version Bump
      id: version_update
      run: bash UpdateProjectVersion.sh "${{ inputs.version_type }}"
    
    - name: Create TAG
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git tag -a v${{ steps.version_update.outputs.UPDATED_VERSION }} -m "Release version ${{ steps.version_update.outputs.UPDATED_VERSION }}"

    - name: Commit version bump
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Release version [v${{ steps.version_update.outputs.UPDATED_VERSION }}]"
        file_pattern: pom.xml
        branch: master
    
    - name: Create JAR Artifact with Maven
      run: mvn -B package -Dmaven.test.skip=true --file pom.xml
      
    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
